[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "usso"
version = "0.31.11"
description = "A plug-and-play client for integrating universal single sign-on (SSO) with Python frameworks, enabling secure and seamless authentication across microservices."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["usso", "sso", "authentication", "security", "fastapi", "django"]
authors = [{ name = "Mahdi Kiani", email = "mahdikiany@gmail.com" }]
maintainers = [{ name = "Mahdi Kiani", email = "mahdikiany@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pydantic>=2",
  "cryptography>=48.0.0",
  "cachetools",
  "aiocache",
  "singleton_package",
  "json-advanced",
  "httpx",
  "usso-jwt>=0.2.10",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.65.0", "uvicorn[standard]>=0.13.0"]
django = ["Django>=3.2"]
dev = ["check-manifest", "pytest", "pytest_asyncio"]
test = ["coverage"]
validator = ["email-validator", "phonenumbers"]
all = [
  "fastapi>=0.65.0",
  "uvicorn[standard]>=0.13.0",
  "Django>=3.2",
  "check-manifest",
  "pytest",
  "pytest_asyncio",
  "coverage",
]

[project.urls]
"Homepage" = "https://github.com/ussoio/usso-python"
"Bug Reports" = "https://github.com/ussoio/usso-python/issues"
"Funding" = "https://github.com/ussoio/usso-python"
"Say Thanks!" = "https://saythanks.io/to/mahdikiani"
"Source" = "https://github.com/ussoio/usso-python"

[project.scripts]
usso = "usso:main"

[tool.setuptools]
package-data = { "usso_jwt" = ["*.dat"] }

[tool.ruff]
line-length = 79
target-version = "py313"
fix = true
unsafe-fixes = true
preview = true

[tool.ruff.lint]
select = [
  "F",      # Pyflakes: undefined names, unused imports, invalid code patterns
  "E",      # pycodestyle errors: PEP 8 style errors
  "W",      # pycodestyle warnings: PEP 8 style warnings

  "I",      # isort: import ordering and grouping
  "UP",     # pyupgrade: modernize Python syntax
  "B",      # flake8-bugbear: likely bugs and problematic patterns
  "SIM",    # flake8-simplify: simplify unnecessarily complex code
  "PERF",   # Perflint: detect avoidable performance problems

  "A",      # flake8-builtins: prevent shadowing Python built-ins
  "ARG",    # flake8-unused-arguments: detect unused function arguments
  "ASYNC",  # flake8-async: detect common async/await problems
  "C4",     # flake8-comprehensions: improve list/set/dict comprehensions
  "C90",    # McCabe: enforce cyclomatic complexity limits
  "D",      # pydocstyle: enforce docstring presence and conventions
  # "DOC",    # pydocstyle: enforce docstring presence and conventions
  "DTZ",    # flake8-datetimez: require timezone-aware datetime usage
  "ERA",    # eradicate: detect commented-out code
  "EXE",    # flake8-executable: validate executable files and shebangs
  "G",      # flake8-logging-format: validate logging format usage
  "ISC",    # flake8-implicit-str-concat: detect implicit string concatenation
  "LOG",    # flake8-logging: detect problematic logging patterns
  "N",      # pep8-naming: enforce naming conventions
  "PIE",    # flake8-pie: miscellaneous code quality improvements
  "PTH",    # flake8-use-pathlib: prefer pathlib over os.path
  "RET",    # flake8-return: detect unnecessary or inconsistent return patterns
  "RUF",    # Ruff-specific: additional Ruff correctness and quality rules
  "S",      # flake8-bandit: detect common security issues
  "T20",    # flake8-print: prevent print() and pprint() in production code
  "TID",    # flake8-tidy-imports: enforce clean and controlled imports
  "TRY",    # tryceratops: improve exception and try/except handling

  "ANN",    # flake8-annotations: require type annotations
  "TC",     # flake8-type-checking: manage imports used only for typing

  "PT",     # flake8-pytest-style: enforce consistent pytest patterns

  "PLC",    # Pylint convention
  "PLE",    # Pylint error
  "PLW",    # Pylint warning
  "PLR",    # Pylint refactor
]
ignore = [
  "raise-vanilla-args",
  "missing-trailing-comma",
  "function-call-in-default-argument",
  "blank-line-after-function",
  "incorrect-blank-line-before-class",
  "new-line-after-last-paragraph",
  "multi-line-summary-first-line",
  "missing-blank-line-after-last-section",
  # PL: library/framework false positives
  "import-outside-top-level",  # import-outside-top-level (lazy/circular/optional deps)
  "import-private-name",  # import-private-name (internal package helpers)
  "no-self-use",  # no-self-use (framework interface methods)
  "too-many-arguments",  # too-many-arguments (library API surfaces)
  "too-many-positional-arguments",  # too-many-positional-arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "logging-f-string",
  "assert",
  "magic-value-comparison",
  "compare-to-empty-string",
]
"server/db.py" = ["TRY"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false